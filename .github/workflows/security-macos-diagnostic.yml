name: security-macos-diagnostic
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Identify the failing Seatbelt launch operation
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const {spawnSync} = require('node:child_process');
          const source = fs.readFileSync('src/security/sandbox.ts', 'utf8');
          const body = source.match(/export function seatbeltProfile\(workspace: string\): string \{([\s\S]*?)\n\}/)?.[1];
          if (!body) throw new Error('Seatbelt profile function not found');
          const workspace = fs.realpathSync(fs.mkdtempSync(path.join(os.tmpdir(), 'pb-launch-diagnostic-')));
          const profile = new Function('workspace', 'seatbeltString', body)(workspace, JSON.stringify);
          const cases = [
            ['baseline', '(version 1)(allow default)'],
            ['shipped', profile],
            ['all-read', profile + '\n(allow file-read* file-map-executable)'],
            ...['/private/var', '/private/etc', '/dev', '/Library', '/System/Volumes', '/private/var/db', '/private/var/run'].map(p => [p, profile + `\n(allow file-read* file-map-executable (subpath ${JSON.stringify(p)}))`]),
            ['all-mach', profile + '\n(allow mach-lookup)'],
            ['all-ipc', profile + '\n(allow ipc-posix* ipc-sysv*)'],
            ['process-info', profile + '\n(allow process-info* (target same-sandbox))'],
            ['task-port', profile + '\n(allow mach-priv-task-port (target same-sandbox))'],
            ['system-read', profile + '\n(allow file-read* file-map-executable (subpath "/System") (subpath "/usr") (subpath "/bin") (subpath "/sbin"))'],
          ];
          try {
            for (const [name, policy] of cases) {
              for (const executable of ['/bin/echo', '/bin/sh']) {
                const args = executable === '/bin/sh' ? ['-c', 'echo diagnostic-ok'] : ['diagnostic-ok'];
                const result = spawnSync('/usr/bin/sandbox-exec', ['-p', policy, executable, ...args], {
                  cwd: workspace,
                  env: {PATH: '/usr/bin:/bin:/usr/sbin:/sbin', HOME: workspace, TMPDIR: workspace},
                  encoding: 'utf8', timeout: 5000,
                });
                console.log(JSON.stringify({name, executable, status: result.status, signal: result.signal,
                  error: result.error?.message, stdout: result.stdout, stderr: result.stderr}));
              }
            }
          } finally { fs.rmSync(workspace, {recursive:true, force:true}); }
          NODE
      - name: Read launch crash reports
        if: always()
        shell: bash
        run: |
          /usr/bin/log show --last 3m --style compact --predicate 'process == "sandbox-exec" OR process == "sh" OR process == "echo" OR eventMessage CONTAINS "pb-launch-diagnostic"' | tail -100
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f \( -name 'sh-*' -o -name 'echo-*' -o -name 'sandbox-exec-*' \) -mmin -5 -exec tail -100 {} \; 2>/dev/null || true
