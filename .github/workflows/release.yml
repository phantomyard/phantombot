name: Release on PR merge

# Fires on pushes to main (i.e. PR merges — branch protection requires PRs,
# so a push to main IS a merge) EXCEPT docs/website-only merges, which are
# filtered out by the paths-ignore denylist below. Cuts a GitHub Release tagged
# v1.1.<RUN_NUMBER> with cross-compiled binaries (linux x64-baseline +
# arm64, darwin x64 + arm64, windows x64 + arm64) and a SHA256SUMS file.
# `phantombot update` reads this feed.
#
# Why `push: main` and NOT `pull_request: closed`: a PR merged from a
# FORK runs the closed-PR workflow with a *read-only* GITHUB_TOKEN —
# GitHub strips write scope from fork-triggered pull_request runs by
# design, so `gh release create` 403s ("Resource not accessible by
# integration"). This bit us on v1.1.100 (PR #151, the first external
# fork contribution). A `push` to a branch in THIS repo always runs with
# the base repo's full read-write token regardless of where the merged
# code originated, because the merge commit already lives on main. We do
# NOT use `pull_request_target` (the other fork-write option) on purpose:
# it would run unreviewed fork code with secrets + write scope BEFORE
# merge. push fires only AFTER review + merge, so the code is already trusted.
#
# The workflow `name:` is deliberately left as "Release on PR merge" and
# the file path is unchanged: github.run_number is keyed to the workflow
# file and must never regress (it IS the version number — see below), so
# we avoid anything that could reset the counter. Every push to main is
# still a PR merge, so the name stays accurate.
#
# Why github.run_number and not the PR number: PR numbers can regress
# if a later-numbered PR is merged before an earlier-numbered one
# (e.g. PR #50 lands while #49 is still in review, then #49 lands and
# would produce v1.0.49 *after* v1.0.50). `phantombot update` does string
# equality on the latest release tag, but humans reading "version went
# backwards" get confused, and any future ordering heuristic breaks.
# github.run_number is a per-workflow monotonic counter — it only ever
# goes up, and every value points to exactly one Actions run, so we can
# pivot from a deployed binary to the build that produced it in one click.
# The originating PR number is preserved in the release title and notes
# so the audit trail (which PR shipped what) is still intact.
#
# Why the minor bump from 1.0 → 1.1: the first run under run_number-based
# tagging would have been v1.0.64, which collided with the old PR-numbered
# v1.0.64 (from PR #64 back in early May 2026) and made `gh release create`
# fail with "tag already exists". The PR-numbered era went up to ~v1.0.109,
# so any run_number under ~110 would have collided. Bumping minor to 1.1
# gives us a clean namespace with no overlap, while the run_number itself
# keeps its meaning (it's still the per-workflow counter, just one minor
# slot higher). Don't bump minor again on the next collision risk —
# there isn't one; run_number only grows from here and 1.1.<N> can run
# to infinity.
#
# Why every PR (not manual tags): the user runs `phantombot update --force
# --restart` from cron and wants always-fresh binaries. If a PR shouldn't
# release, we'll add a `release:skip` label gate later.
#
# RELEASE RINGS (#432) — every release cut here is a PRERELEASE.
#
# `gh release create --prerelease` below is the whole mechanism. GitHub's
# `/releases/latest` endpoint EXCLUDES prereleases by design, and that is the
# endpoint a stable host resolves against (src/lib/githubReleases.ts), so a
# merge to main now reaches only hosts that opted in with
# `update_channel = "preview"` — they resolve the `/releases` LIST instead and
# take its newest entry.
#
# Promotion to stable is a HUMAN act, not a CI outcome: run the
# "Promote a release to stable" workflow (promote.yml) and press the button.
# It flips `--prerelease=false --latest` on a release that ALREADY EXISTS —
# no rebuild, no re-tag. The bytes a stable host installs are byte-for-byte
# the ones that soaked on the preview ring, which is the entire point; a
# promotion that rebuilt would ship something nobody had run.
#
# Why CI cannot decide this: green tests are the bar for MERGING. If they
# were also the bar for stable, the two rings would be the same ring and the
# soak would be decoration. Stable means a human watched a real host run it.
#
# Why bun-linux-x64-baseline (and not plain bun-linux-x64): one of the
# deploy targets (the `kw-openclaw` supervisor box that runs kai) is older
# silicon without AVX2. The non-baseline target SIGILLs on launch there.
# Don't 'optimise' to plain x64 without verifying every deploy target has
# AVX2 — see the SIGILL post-mortem from the May 2026 first deploy.

# Why paths-ignore (docs/website-only merges do NOT cut a release): a README
# or website copy change is not functional to the app binary, and cutting a
# fresh release for it churns `phantombot update` on every client for nothing.
# The push still lands on main; it just doesn't produce a new binary.
#
# We use paths-ignore (a DENYLIST of non-functional surfaces) rather than a
# paths ALLOWLIST of source dirs on purpose — the model is fail-open to
# releasing. Anything NOT in this list still triggers a release, so a
# functional change to a file type we forgot to allowlist can never silently
# skip a release. Over-releasing is harmless (a duplicate-content binary at a
# higher version); under-releasing ships a fix to nobody.
#
# NOTE on the denylist scope: it is deliberately NARROW. `**.md` is NOT here —
# a blanket markdown ignore is too broad and would risk silently skipping a
# release for markdown that matters. In particular `agents/phantom/*.md` are
# persona system prompts; the binary does not embed them (they are loaded at
# runtime from persona directories — see src/persona/loader.ts), but keeping
# them out of the denylist is the conservative, fail-open call: at worst a
# redundant binary at a higher version, never an under-release. Only the pure
# documentation/marketing surfaces are listed:
#   - README.md / AGENTS.md / LICENSE — top-level docs, not compiled in
#   - docs/**  — the docs site markdown
#   - www/**   — the AIRE marketing website (deployed separately by
#                deploy-pages.yml, which triggers on www/** — so website
#                changes still ship, just via Pages, not a binary release)
#
# run_number implication: when only ignored paths change the workflow does not
# run, so github.run_number does not increment for that merge. That is fine —
# run_number only ever GROWS (the invariant above still holds); it just skips
# the values that would have belonged to docs-only merges. Versions never
# regress, they just aren't contiguous, which nothing depends on.
#
# Squash-merge note: this repo squash-merges (linear history is required), so
# the pushed commit on main carries the PR's FULL diff and the path filter sees
# every changed file. A mixed PR (docs + src) therefore still releases, because
# not all of its files match the ignore list.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'LICENSE'
      - 'docs/**'
      - 'www/**'

permissions:
  contents: write        # create release + upload assets
  pull-requests: read    # commits->pulls lookup for release title/notes audit trail

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@v4
        with:
          # github.sha on a push to main is the merge commit itself.
          ref: ${{ github.sha }}

      - name: Resolve originating PR (audit trail only)
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # On a push event there is no github.event.pull_request context,
          # so recover the PR that introduced this merge commit from the
          # commits→pulls API. This is best-effort: a direct push to main
          # (no PR) yields an empty number, and the release still cuts —
          # the PR ref is purely for the audit trail in the title/notes.
          PR_JSON=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" 2>/dev/null || echo '[]')
          NUMBER=$(echo "$PR_JSON" | jq -r '.[0].number // ""')
          TITLE=$(echo "$PR_JSON" | jq -r '.[0].title // ""')
          # Fall back to the commit subject if no PR was found.
          if [ -z "$TITLE" ]; then
            TITLE=$(git log -1 --pretty=%s)
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "Resolved PR number='$NUMBER' title='$TITLE'"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to a major to keep releases reproducible. A point-release
          # regression in `bun --compile` would otherwise silently break
          # every PR merge until upstream ships a fix, and historical
          # binaries wouldn't carry a recoverable build-toolchain version.
          bun-version: 1.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun tsc --noEmit

      - name: Test
        run: bun test

      - name: Compute version + bake into src/version.ts
        id: version
        env:
          # RUN_NUMBER is the per-workflow monotonic counter (never
          # regresses). PR_NUMBER is kept around purely for the audit
          # trail in the release title and notes — it is no longer part
          # of the version string itself. See the file header comment
          # for the why.
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION="1.1.${RUN_NUMBER}"
          TAG="v${VERSION}"
          # Replace only the literal placeholder so the doc comment in
          # src/version.ts (and any future sibling const) survives. The
          # placeholder must round-trip exactly; see the file's comment.
          sed -i "s/0.1.0-dev/${VERSION}/" src/version.ts
          # Sanity check: the constant must now match VERSION exactly,
          # otherwise the binary would lie about its own version and
          # phantombot update would loop.
          grep -q "VERSION = \"${VERSION}\"" src/version.ts \
            || { echo "version injection failed"; cat src/version.ts; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Rebuild the embedded VS Code extension from THIS commit's source and
      # stamp it with the release version, before any --compile step reads the
      # generated module.
      #
      # This step exists because leaving it manual shipped a broken release:
      # PR #296 fixed the extension, but nobody re-ran `gen:vscode-vsix` and
      # nobody bumped editors/vscode/package.json, so v1.1.204 embedded a
      # .vsix built from PRE-#296 source at the SAME version clients already
      # had. `installVscode` compares versions and skips when
      # `installed >= bundled`, so every client skipped it as "current". The
      # fix reached nobody and `phantombot update` still reported success.
      #
      # Regenerating here makes both halves structurally impossible: the .vsix
      # can never lag the merged source, and the version always increases
      # (run_number is monotonic), so clients always install. `phantombot
      # update` alone is now sufficient to deliver an extension fix — which is
      # the only update path a user should ever need.
      - name: Rebuild + stamp the embedded VS Code extension
        env:
          PHANTOMBOT_EXT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          bun run gen:vscode-vsix
          # The compiled binary is what users get; if it embedded the wrong
          # version the install would be skipped client-side and we'd never
          # know. Fail loudly here instead.
          grep -q "VSCODE_EXTENSION_VERSION = \"${PHANTOMBOT_EXT_VERSION}\"" \
            src/lib/vscodeExtensionAsset.generated.ts \
            || { echo "vsix version stamp failed"; exit 1; }

      - name: Build x64 (baseline — no AVX2 required)
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist
          bun build --compile --target=bun-linux-x64-baseline \
            ./src/index.ts \
            --outfile "dist/phantombot-${TAG}-linux-x64"

      - name: Build arm64
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          bun build --compile --target=bun-linux-arm64 \
            ./src/index.ts \
            --outfile "dist/phantombot-${TAG}-linux-arm64"

      - name: Build darwin-x64 (Intel Mac)
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Cross-compiled from the Linux runner; Bun emits an unsigned
          # Mach-O. install.sh handles the xattr / ad-hoc codesign dance.
          bun build --compile --target=bun-darwin-x64 \
            ./src/index.ts \
            --outfile "dist/phantombot-${TAG}-darwin-x64"

      - name: Build darwin-arm64 (Apple Silicon)
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Cross-compiled from the Linux runner; Bun emits an unsigned
          # Mach-O. First-run on macOS will be quarantined by Gatekeeper —
          # see release notes for the `xattr -d com.apple.quarantine` step.
          bun build --compile --target=bun-darwin-arm64 \
            ./src/index.ts \
            --outfile "dist/phantombot-${TAG}-darwin-arm64"

      - name: Build windows-x64
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Cross-compiled from the Linux runner; Bun emits an UNSIGNED PE
          # (.exe). It is Authenticode signed further down, before checksums
          # are taken - see the signing block. --windows-hide-console is
          # NOT set: phantombot is a console agent and needs its stdio.
          bun build --compile --target=bun-windows-x64 \
            ./src/index.ts \
            --outfile "dist/phantombot-${TAG}-windows-x64.exe"

      - name: Build windows-arm64
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # ARM64 Windows (e.g. Surface Pro X, Dev Kit). Bun's compile
          # target id is bun-windows-arm64; the emitted PE is Aarch64.
          # Signed alongside windows-x64 below, before checksums.
          bun build --compile --target=bun-windows-arm64 \
            ./src/index.ts \
            --outfile "dist/phantombot-${TAG}-windows-arm64.exe"

      # ---------------------------------------------------------------
      # Windows Authenticode signing (SSL.com eSigner, cloud HSM)
      # ---------------------------------------------------------------
      #
      # WHY AT BUILD AND NOT AT PROMOTE: promote.yml never rebuilds. It flips
      # an existing release to stable precisely so the bytes that soaked on
      # the preview ring are the bytes stable installs, and it verifies the
      # published SHA256SUMS before flipping. Signing at promote time would
      # have to mutate already-published assets and regenerate those
      # checksums, i.e. stable would ship something no one had run. So the
      # signature is part of the build — which also means every prerelease is
      # signed, and a preview host is exercising the exact artifact stable
      # will later serve.
      #
      # ORDERING IS LOAD-BEARING: this runs BEFORE "Compute SHA256SUMS".
      # Authenticode embeds the signature inside the PE, so signing changes
      # the file's hash. Checksums taken first would describe a file that no
      # longer exists and every `sha256sum -c SHA256SUMS` would fail.
      #
      # WHY A LINUX RUNNER CAN SIGN WINDOWS BINARIES: the private key never
      # leaves SSL.com's cloud HSM (it is not downloadable — there is no .pfx
      # to install). CodeSignTool is a Java client that uploads the digest and
      # gets a signature back, so the host OS is irrelevant. That keeps the
      # whole release on one runner, with the .exe files already on disk.
      #
      # WHY THE ACTION IS PINNED TO A COMMIT SHA: this step receives our
      # signing credentials. A moving tag (or @develop, which the vendor's own
      # README suggests) lets upstream change what executes here after review.
      # The sha below is v1.3.2. Re-pin deliberately when upgrading.
      #
      # WHY THAT PIN IS NOT ENOUGH ON ITS OWN: the action sha freezes the
      # action's code, not the code it RUNS. Its setup() downloads
      # CodeSignTool-v1.3.0.zip from a GitHub *release asset* URL and executes
      # the Java program inside it with no digest check, and release assets are
      # mutable - they can be deleted and re-uploaded at the same URL. So the
      # bytes that actually receive ES_PASSWORD and the TOTP seed were not
      # pinned by the sha at all. The two steps below close that: we fetch the
      # archive ourselves, check it against a reviewed SHA-256, and hand the
      # action a pre-verified copy (setup() treats an existing
      # CODESIGNTOOL_PATH as installed and skips its own download). Same
      # reasoning for the JDK: left alone, the action fetches an Amazon
      # Corretto build unverified, so we give it the runner's JDK instead.
      #
      # CREDENTIALS: ES_USERNAME / ES_PASSWORD are the SSL.com account,
      # ES_CREDENTIAL_ID selects WHICH credential on that account to sign with
      # (the account also holds a document-sealing "eSeal" credential which is
      # marked default and would otherwise be picked), ES_TOTP_SECRET is the
      # seed CodeSignTool uses to mint the one-time code. All four live in the
      # repo secrets; none of them is recoverable from the issued certificate.
      #
      # This workflow only ever runs on push to main, so secrets are always
      # available — a fork PR cannot reach this job at all.
      - name: Assert signing credentials are present
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          # Fail here with a readable message rather than deep inside a Java
          # stack trace. Do NOT turn this into a "skip signing" branch: a
          # release that silently ships unsigned .exe files while the notes
          # promise a signature is worse than a failed release.
          missing=""
          for v in ES_USERNAME ES_PASSWORD ES_CREDENTIAL_ID ES_TOTP_SECRET; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing eSigner secret(s):$missing"
            exit 1
          fi

      # Pinned bytes for the signer itself. The digest was taken from the
      # published v1.3.0 asset and corroborated independently: the
      # code_sign_tool-1.3.0.jar inside the archive is itself EV code signed by
      # "SSL Corp" (SSL.com EV Code Signing Intermediate CA RSA R3), so this is
      # a digest of genuine vendor bytes and not merely of whatever the URL
      # happened to serve on the day. Bump both URL and digest together, and
      # re-check that jar signer, when upgrading CodeSignTool.
      - name: Fetch and verify CodeSignTool
        env:
          CST_URL: https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.0/CodeSignTool-v1.3.0.zip
          CST_SHA256: 359782cee5c709b172610e2abd8cb49445bfadd26f44073ca18600c585b91b8d
        run: |
          set -euo pipefail
          # Deliberately under RUNNER_TEMP, i.e. OUTSIDE the checkout: a 34 MB
          # Java tree inside the workspace is one careless glob away from being
          # treated as a build input or uploaded as a release asset.
          root="$RUNNER_TEMP/codesigntool"
          mkdir -p "$root"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-connrefused --retry-delay 2 \
            -o "$root/CodeSignTool.zip" "$CST_URL"
          # Mismatch fails the release. There is no fallback branch on purpose:
          # an unexpected signer binary is exactly when NOT to keep going.
          ( cd "$root" && printf '%s  %s\n' "$CST_SHA256" CodeSignTool.zip | sha256sum -c - )
          # The archive is flat - CodeSignTool.sh, conf/ and jar/ sit at its
          # root with no wrapping folder - so extract into the versioned
          # directory ourselves. CODESIGNTOOL_PATH must be the directory that
          # DIRECTLY contains those entries, and it has to stay writable: the
          # action rewrites CodeSignTool.sh and conf/code_sign_tool.properties
          # in place before running them.
          dest="$root/CodeSignTool-v1.3.0"
          rm -rf "$dest"
          unzip -q "$root/CodeSignTool.zip" -d "$dest"
          test -f "$dest/CodeSignTool.sh"
          test -f "$dest/conf/code_sign_tool.properties"
          test -f "$dest/jar/code_sign_tool-1.3.0.jar"
          echo "CODESIGNTOOL_PATH=$dest" >> "$GITHUB_ENV"

      # CodeSignTool is a Java program. The action only skips installing a JDK
      # when it sees JAVA_VERSION >= 11 in the environment; the runner image
      # sets JAVA_HOME but not JAVA_VERSION, so without this the action would
      # download a Corretto build (also unverified) on every release. Pin the
      # JDK here and export JAVA_VERSION so it uses this one.
      - name: Set up the JDK CodeSignTool runs on
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Sign windows-x64 .exe
        uses: SSLcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b
        env:
          # Tells the action a JDK is already present so it does not fetch one.
          JAVA_VERSION: '17'
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ github.workspace }}/dist/phantombot-${{ steps.version.outputs.tag }}-windows-x64.exe
          output_path: ${{ github.workspace }}/signed
          environment_name: PROD
          # The malware pre-scan is a separate SSL.com service; leaving it off
          # keeps signing to one operation per file. Bun-compiled single-file
          # executables are also a known false-positive shape for scanners.
          malware_block: false

      - name: Sign windows-arm64 .exe
        uses: SSLcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b
        env:
          # Tells the action a JDK is already present so it does not fetch one.
          JAVA_VERSION: '17'
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ github.workspace }}/dist/phantombot-${{ steps.version.outputs.tag }}-windows-arm64.exe
          output_path: ${{ github.workspace }}/signed
          environment_name: PROD
          malware_block: false

      # CodeSignTool writes the signed copy into output_path and leaves the
      # input untouched, so put the signed files back where every downstream
      # step (checksums, release upload) already expects them.
      - name: Replace the unsigned .exe files with the signed ones
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          for arch in x64 arm64; do
            name="phantombot-${TAG}-windows-${arch}.exe"
            src="signed/${name}"
            # A missing output is the silent-failure mode that matters: the
            # vendor action decides success by grepping its own stdout, so it
            # can report green having produced nothing.
            [ -s "$src" ] || { echo "::error::$src missing or empty — signing produced no artifact"; exit 1; }
            mv "$src" "dist/${name}"
          done

      # Independent proof that a signature is actually embedded, checked
      # against the certificate we expect rather than against the signing
      # tool's own say-so. Chain/timestamp validation is deliberately NOT
      # asserted here — the runner has no reason to trust SSL.com's roots and
      # a transient TSA hiccup should not fail a release — but "there is a
      # signature and it is OUR certificate" is exactly the property that
      # would regress silently if the credential id ever pointed at the wrong
      # credential (e.g. the eSeal one) or the step were reordered.
      - name: Verify the embedded Authenticode signatures
        env:
          TAG: ${{ steps.version.outputs.tag }}
          EXPECTED_SIGNER: Andrew Hodges
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq osslsigncode
          for arch in x64 arm64; do
            f="dist/phantombot-${TAG}-windows-${arch}.exe"
            echo "--- $f"
            # osslsigncode exits non-zero when it cannot verify the chain,
            # which we are not asserting, so capture output and judge on
            # content instead of exit status.
            out=$(osslsigncode verify -in "$f" 2>&1 || true)
            echo "$out"
            case "$out" in
              *"No signature found"*)
                echo "::error::$f is NOT signed"; exit 1 ;;
            esac
            echo "$out" | grep -qi "CN=${EXPECTED_SIGNER}" \
              || { echo "::error::$f is signed by an unexpected certificate (expected CN=${EXPECTED_SIGNER})"; exit 1; }
          done

      - name: Compute SHA256SUMS
        working-directory: dist
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          sha256sum \
            "phantombot-${TAG}-linux-x64" \
            "phantombot-${TAG}-linux-arm64" \
            "phantombot-${TAG}-darwin-x64" \
            "phantombot-${TAG}-darwin-arm64" \
            "phantombot-${TAG}-windows-x64.exe" \
            "phantombot-${TAG}-windows-arm64.exe" \
            > SHA256SUMS
          cat SHA256SUMS

      - name: Write release notes to file
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          SHA: ${{ github.sha }}
        run: |
          # PR_NUMBER is empty for a direct push (no PR). Render the
          # originating-PR lines only when we actually resolved one,
          # otherwise point at the commit so the audit trail still holds.
          if [ -n "$PR_NUMBER" ]; then
            ORIGIN_LINE="Originating PR: #${PR_NUMBER} — ${PR_TITLE}"
            PR_LINK_LINE="Pull request: ${SERVER_URL}/${REPO}/pull/${PR_NUMBER}"
          else
            ORIGIN_LINE="Originating commit: ${SHA} — ${PR_TITLE}"
            PR_LINK_LINE="Commit: ${SERVER_URL}/${REPO}/commit/${SHA}"
          fi
          cat > release-notes.md <<EOF
          Automated release from workflow run #${RUN_NUMBER} (run id ${RUN_ID}).
          ${ORIGIN_LINE}

          Build run: ${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}
          ${PR_LINK_LINE}

          Binaries:
          - phantombot-${TAG}-linux-x64 — x86-64, baseline (no AVX2 required)
          - phantombot-${TAG}-linux-arm64 — ARM64
          - phantombot-${TAG}-darwin-x64 — macOS x86-64 (unsigned; see below)
          - phantombot-${TAG}-darwin-arm64 — macOS Apple Silicon (unsigned; see below)
          - phantombot-${TAG}-windows-x64.exe - Windows x86-64 (Authenticode signed)
          - phantombot-${TAG}-windows-arm64.exe - Windows ARM64 (Authenticode signed)

          Verify with: sha256sum -c SHA256SUMS

          Install with: phantombot update

          Release ring: PREVIEW. This is a prerelease, so it is served only to
          hosts running \`update_channel = "preview"\`; \`/releases/latest\`
          does not return it and stable hosts will not see it. To ship it to
          everyone, run the "Promote a release to stable" workflow against
          ${TAG} — that flips this exact release (same binaries, same
          checksums) to latest without rebuilding.

          macOS note: the darwin binaries are cross-compiled and unsigned.
          install.sh handles the xattr / ad-hoc codesign dance for you. If
          you download the binary directly, clear the Gatekeeper quarantine
          attribute on first run:
            xattr -d com.apple.quarantine ./phantombot-${TAG}-darwin-arm64
            xattr -d com.apple.quarantine ./phantombot-${TAG}-darwin-x64

          Windows note: the .exe binaries are Authenticode signed by
          "Andrew Hodges" (SSL.com code-signing certificate, cloud HSM). Check
          the signature before running:
            Get-AuthenticodeSignature .\\phantombot-${TAG}-windows-x64.exe
          SmartScreen may still show a "Windows protected your PC" prompt until
          this certificate builds reputation - choose More info then Run
          anyway, or unblock the file:
            Unblock-File .\\phantombot-${TAG}-windows-x64.exe
          EOF

      - name: Create GitHub Release with binary assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          SHA: ${{ github.sha }}
        run: |
          # --target pins the git tag to the exact commit we built from.
          # Without it, a second push landing mid-workflow would shift the
          # tag onto the wrong sha (binaries would still be correct, but
          # `git checkout v1.1.N` would lie about what code is in there).
          # Release title carries the PR number when we resolved one so the
          # GitHub Releases UI surfaces the originating PR without opening
          # the notes; a direct push falls back to a plain tag title.
          if [ -n "$PR_NUMBER" ]; then
            TITLE="$TAG (PR #${PR_NUMBER})"
          else
            TITLE="$TAG"
          fi
          # --prerelease is the release-ring gate (#432): it keeps this build
          # out of /releases/latest, so only preview hosts resolve it until a
          # human promotes it via promote.yml. Do NOT drop this flag to "fix"
          # an update that isn't arriving — that ships an unsoaked build to
          # the whole fleet. Promote the tag instead.
          gh release create "$TAG" \
            --prerelease \
            --target "$SHA" \
            --title "$TITLE" \
            --notes-file release-notes.md \
            "dist/phantombot-${TAG}-linux-x64" \
            "dist/phantombot-${TAG}-linux-arm64" \
            "dist/phantombot-${TAG}-darwin-x64" \
            "dist/phantombot-${TAG}-darwin-arm64" \
            "dist/phantombot-${TAG}-windows-x64.exe" \
            "dist/phantombot-${TAG}-windows-arm64.exe" \
            "dist/SHA256SUMS"
