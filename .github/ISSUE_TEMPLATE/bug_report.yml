name: Bug report
description: Something in Phantombot doesn't work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. phantombot ...
        2. ...
  - type: input
    id: version
    attributes:
      label: Phantombot version
      description: Output of `phantombot --version`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: Harness
      description: Native, Pi, Claude Code, Codex, or other.
  - type: textarea
    id: logs
    attributes:
      label: Logs and doctor output
      description: Relevant lines from `phantombot logs --no-follow` and `phantombot doctor`. Remove any secrets first.
      render: text
